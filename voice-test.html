<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>音色试听 · Vmi</title>
<style>
  :root{
    --bg:#080808;
    --panel:#111;
    --line:rgba(255,255,255,.12);
    --text:#f2f2f2;
    --dim:#8a8a8a;
    --accent:#e03e3e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:44px 20px 72px;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Noto Sans SC",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{max-width:760px;margin:0 auto 26px;}
  h1{margin:0 0 10px;font-size:1.45rem;font-weight:600;letter-spacing:.02em;}
  p.lead{margin:0;color:var(--dim);font-size:.85rem;line-height:1.7;}
  .gate{
    max-width:760px;margin:0 auto 20px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .gate input{
    flex:1 1 220px;min-width:0;
    padding:10px 12px;border-radius:10px;
    background:#151515;border:1px solid var(--line);color:var(--text);
    font-size:.85rem;font-family:inherit;
  }
  .gate input:focus{outline:none;border-color:rgba(255,255,255,.4);}
  .gate button{
    padding:10px 16px;border-radius:10px;border:1px solid var(--line);
    background:#f2f2f2;color:#080808;font-weight:600;font-size:.85rem;
    cursor:pointer;font-family:inherit;
  }
  .gate-note{flex:1 1 100%;color:var(--dim);font-size:.75rem;}
  .grid{max-width:760px;margin:0 auto;display:grid;gap:10px;}
  .card{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    transition:border-color .2s,background .2s;
  }
  .card.playing{border-color:rgba(224,62,62,.65);background:#171010;}
  .card.picked{border-color:rgba(255,255,255,.55);}
  .num{
    flex:0 0 30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.75rem;color:var(--dim);
    border:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  .card.playing .num{color:#fff;border-color:var(--accent);}
  .info{flex:1;min-width:0;}
  .name{font-size:.95rem;margin-bottom:4px;}
  .desc{font-size:.75rem;color:var(--dim);line-height:1.5;}
  .actions{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  button.play,button.pick{
    flex:0 0 auto;
    padding:9px 14px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--text);
    font-size:.78rem;cursor:pointer;font-family:inherit;
    transition:background .2s,border-color .2s;
  }
  button.play{min-width:64px;}
  button.pick{min-width:52px;color:var(--dim);}
  button.play:hover,button.pick:hover{border-color:rgba(255,255,255,.4);}
  button.play:disabled{opacity:.45;cursor:default;}
  .card.playing button.play{border-color:var(--accent);background:rgba(224,62,62,.14);}
  .card.picked button.pick{color:#fff;border-color:rgba(255,255,255,.55);}
  .err{color:#ff7b7b;font-size:.72rem;margin-top:4px;}
  .card audio.fallback{flex:1 1 100%;width:100%;margin-top:8px;}
  footer{max-width:760px;margin:26px auto 0;color:var(--dim);font-size:.75rem;line-height:1.7;}
  @media(max-width:480px){
    body{padding:26px 14px 56px;}
    .card{padding:12px;gap:10px;flex-wrap:wrap;}
    .actions{width:100%;justify-content:flex-end;}
    button.play{flex:1;}
  }
</style>
</head>
<body>
<header>
  <h1>Vmi 音色试听</h1>
  <p class="lead">10 个腾讯云精品音色，同一句「欢迎回家，Vikyi」。听完点「选它」，Vmi 就用这个音色播报。<br>第 1 号智瑜最接近小爱同学的调子。</p>
</header>

<div class="gate" id="gate">
  <input type="password" id="pwd" autocomplete="off" spellcheck="false" placeholder="输入工作台密码" />
  <button type="button" id="pwdSave">解锁试听</button>
  <div class="gate-note" id="gateNote">密码只用于换取音频，不会保存在本页以外的任何地方。</div>
</div>

<div class="grid" id="grid"></div>
<footer>
  音频由腾讯云语音合成实时生成，首次播放约需 1–2 秒。精选音色都在 800 万字符免费包范围内。
</footer>

<script>
(function(){
  var TEXT = '欢迎回家，Vikyi';
  var PWD_KEY = 'v_ing_ws_pwd';
  var VOICES = [
    { key:101001, name:'智瑜', desc:'情感女声 · 温暖自然，最接近小爱' },
    { key:101011, name:'智燕', desc:'新闻女声 · 清晰、播报感' },
    { key:101027, name:'智梅', desc:'通用女声 · 平稳亲和' },
    { key:101026, name:'智希', desc:'通用女声 · 语气轻快' },
    { key:101055, name:'智付', desc:'通用女声 · 干净利落' },
    { key:101016, name:'智甜', desc:'女童声 · 小女孩音色' },
    { key:101004, name:'智云', desc:'通用男声 · 沉稳' },
    { key:101030, name:'智柯', desc:'通用男声 · 日常口语' },
    { key:101013, name:'智辉', desc:'新闻男声 · 专业播音' },
    { key:101021, name:'智瑞', desc:'新闻男声 · 成熟稳重' }
  ];

  var grid = document.getElementById('grid');
  var pwdInput = document.getElementById('pwd');
  var pwdSave = document.getElementById('pwdSave');
  var gateNote = document.getElementById('gateNote');
  var audio = new Audio();
  audio.setAttribute('playsinline', '');
  audio.setAttribute('webkit-playsinline', '');
  audio.preload = 'auto';
  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
  var unlocked = false;
  var current = null;
  var pwd = '';

  try { pwd = sessionStorage.getItem(PWD_KEY) || ''; } catch (e) {}
  if (pwd) pwdInput.value = pwd;

  audio.addEventListener('ended', setIdle);
  audio.addEventListener('error', function(){
    if (current) fail(current, '播放失败，请再点一次');
    setIdle();
  });

  function note(text, bad){
    gateNote.textContent = text;
    gateNote.style.color = bad ? '#ff7b7b' : '';
  }

  function setIdle(){
    grid.querySelectorAll('.card.playing').forEach(function(c){ c.classList.remove('playing'); });
    grid.querySelectorAll('button.play').forEach(function(b){ b.disabled = false; b.textContent = '试听'; });
    current = null;
  }

  function fail(card, msg){
    var old = card.querySelector('.err');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'err';
    el.textContent = msg;
    card.querySelector('.info').appendChild(el);
  }

  function readPwd(){
    var p = (pwdInput.value || '').trim();
    if (!p){
      note('先输入工作台密码。', true);
      pwdInput.focus();
      return '';
    }
    pwd = p;
    try { sessionStorage.setItem(PWD_KEY, p); } catch (e) {}
    return p;
  }

  // iOS/Safari only allow playback started inside a user gesture. Play a
  // silent clip on the tap so the fetched MP3 can autoplay afterwards.
  function unlock(){
    if (unlocked) return;
    try{
      audio.muted = true;
      audio.src = SILENT;
      var p = audio.play();
      var done = function(){
        try{ audio.pause(); audio.currentTime = 0; }catch(e){}
        audio.muted = false;
        unlocked = true;
      };
      if (p && typeof p.then === 'function'){ p.then(done).catch(function(){ audio.muted = false; }); }
      else { done(); }
    }catch(e){ audio.muted = false; }
  }

  // If the browser still refuses to play, show a native player so the clip is
  // reachable with a direct tap.
  function nativePlayer(card, url){
    var old = card.querySelector('audio.fallback');
    if (old) old.remove();
    var el = document.createElement('audio');
    el.className = 'fallback';
    el.controls = true;
    el.setAttribute('playsinline', '');
    el.src = url;
    card.appendChild(el);
  }

  function errText(res, d){
    if (res.status === 403) return '密码不对，请重新输入。';
    if (res.status === 503) {
      if (d.error === 'Voice not configured') return '还没配置腾讯云凭据，先去「工作台 → 设置 → 语音」保存 SecretId / SecretKey。';
      if (d.error === 'Invalid voice key') return '腾讯云凭据无效，请回设置里检查 SecretId / SecretKey。';
      if (d.error === 'Voice quota exceeded') return '免费额度用完或未领取免费包，请到腾讯云语音合成控制台检查。';
    }
    if (res.status === 400 && d.error === 'Unknown voice') return '这个音色暂不可用。';
    return '生成失败（' + res.status + '），稍后再试。';
  }

  function play(card, btn, voice){
    var old = card.querySelector('.err');
    if (old) old.remove();
    if (current === card && !audio.paused){
      audio.pause();
      setIdle();
      return;
    }
    var p = readPwd();
    if (!p) return;

    unlock();
    setIdle();
    current = card;
    card.classList.add('playing');
    btn.disabled = true;
    btn.textContent = '生成中';

    fetch('/api/v-ing-tts?voice=' + encodeURIComponent(voice.key) +
          '&text=' + encodeURIComponent(TEXT), { headers: { 'X-Password': p } })
      .then(function(res){
        if (res.ok) return res.blob();
        return res.json().catch(function(){ return {}; }).then(function(d){
          throw new Error(errText(res, d || {}));
        });
      })
      .then(function(blob){
        if (!blob.size) throw new Error('生成失败，请再点一次。');
        var url = URL.createObjectURL(blob);
        audio.muted = false;
        audio.src = url;
        audio.play().then(function(){
          if (btn.textContent === '生成中') btn.textContent = '播放中';
          note('已解锁，可以直接点试听。');
        }).catch(function(){
          nativePlayer(card, url);
          throw new Error('浏览器拦截了播放，请点下方播放条。');
        });
      })
      .catch(function(err){
        note(err.message, true);
        fail(card, err.message);
        setIdle();
      });
  }

  function pick(card, btn, voice){
    var p = readPwd();
    if (!p) return;
    btn.disabled = true;
    fetch('/api/v-ing-voice-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Password': p },
      body: JSON.stringify({ voiceId: voice.key })
    }).then(function(res){
      if (!res.ok) return res.json().catch(function(){ return {}; }).then(function(d){
        if (res.status === 403) throw new Error('密码不对，请重新输入。');
        if (d.error && d.error.indexOf('secretId') >= 0) {
          throw new Error('先在「工作台 → 设置 → 语音」保存 SecretId / SecretKey，再选音色。');
        }
        throw new Error(d.error || '保存失败，请稍后再试。');
      });
      return res.json();
    }).then(function(){
      grid.querySelectorAll('.card.picked').forEach(function(c){ c.classList.remove('picked'); });
      card.classList.add('picked');
      note('已选定「' + voice.name + '」，Vmi 之后用这个音色播报。');
    }).catch(function(err){
      note(err.message, true);
    }).then(function(){
      btn.disabled = false;
    });
  }

  VOICES.forEach(function(v, i){
    var card = document.createElement('div');
    card.className = 'card';

    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = String(i + 1);

    var info = document.createElement('div');
    info.className = 'info';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = v.name;
    var desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = v.desc;
    info.appendChild(name);
    info.appendChild(desc);

    var actions = document.createElement('div');
    actions.className = 'actions';

    var btn = document.createElement('button');
    btn.className = 'play';
    btn.type = 'button';
    btn.textContent = '试听';
    btn.addEventListener('click', function(){ play(card, btn, v); });

    var pickBtn = document.createElement('button');
    pickBtn.className = 'pick';
    pickBtn.type = 'button';
    pickBtn.textContent = '选它';
    pickBtn.addEventListener('click', function(){ pick(card, pickBtn, v); });

    actions.appendChild(btn);
    actions.appendChild(pickBtn);

    card.appendChild(num);
    card.appendChild(info);
    card.appendChild(actions);
    grid.appendChild(card);
  });

  pwdSave.addEventListener('click', function(){
    if (!readPwd()) return;
    note('已解锁，点任意一条试听。');
  });

  pwdInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); pwdSave.click(); }
  });
})();
</script>
</body>
</html>
