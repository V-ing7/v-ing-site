<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>音色试听 · Vmi</title>
<style>
  :root{
    --bg:#080808;
    --panel:#111;
    --line:rgba(255,255,255,.12);
    --text:#f2f2f2;
    --dim:#8a8a8a;
    --accent:#e03e3e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:44px 20px 72px;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Noto Sans SC",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{max-width:760px;margin:0 auto 26px;}
  h1{margin:0 0 10px;font-size:1.45rem;font-weight:600;letter-spacing:.02em;}
  p.lead{margin:0;color:var(--dim);font-size:.85rem;line-height:1.7;}
  .gate{
    max-width:760px;margin:0 auto 20px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .gate input{
    flex:1 1 220px;min-width:0;
    padding:10px 12px;border-radius:10px;
    background:#151515;border:1px solid var(--line);color:var(--text);
    font-size:.85rem;font-family:inherit;
  }
  .gate input:focus{outline:none;border-color:rgba(255,255,255,.4);}
  .gate button{
    padding:10px 16px;border-radius:10px;border:1px solid var(--line);
    background:#f2f2f2;color:#080808;font-weight:600;font-size:.85rem;
    cursor:pointer;font-family:inherit;
  }
  .gate-note{flex:1 1 100%;color:var(--dim);font-size:.75rem;}
  .grid{max-width:760px;margin:0 auto;display:grid;gap:10px;}
  .card{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    transition:border-color .2s,background .2s;
  }
  .card.playing{border-color:rgba(224,62,62,.65);background:#171010;}
  .num{
    flex:0 0 30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.75rem;color:var(--dim);
    border:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  .card.playing .num{color:#fff;border-color:var(--accent);}
  .info{flex:1;min-width:0;}
  .name{font-size:.95rem;margin-bottom:4px;}
  .desc{font-size:.75rem;color:var(--dim);line-height:1.5;}
  button.play{
    flex:0 0 auto;min-width:76px;
    padding:9px 14px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--text);
    font-size:.78rem;cursor:pointer;font-family:inherit;
    transition:background .2s,border-color .2s;
  }
  button.play:hover{border-color:rgba(255,255,255,.4);}
  button.play:disabled{opacity:.45;cursor:default;}
  .card.playing button.play{border-color:var(--accent);background:rgba(224,62,62,.14);}
  .err{color:#ff7b7b;font-size:.72rem;margin-top:4px;}
  footer{max-width:760px;margin:26px auto 0;color:var(--dim);font-size:.75rem;line-height:1.7;}
  @media(max-width:480px){
    body{padding:26px 14px 56px;}
    .card{padding:12px;gap:10px;}
    button.play{min-width:64px;padding:8px 10px;}
  }
</style>
</head>
<body>
<header>
  <h1>Vmi 音色试听</h1>
  <p class="lead">10 个 Azure 中文音色，同一句「欢迎回家，Vikyi」。听完记下喜欢的编号告诉我即可。<br>第 1 号晓晓最接近小爱同学的调子。</p>
</header>

<div class="gate" id="gate">
  <input type="password" id="pwd" autocomplete="off" spellcheck="false" placeholder="输入工作台密码" />
  <button type="button" id="pwdSave">解锁试听</button>
  <div class="gate-note" id="gateNote">密码只用于换取音频，不会保存在本页以外的任何地方。</div>
</div>

<div class="grid" id="grid"></div>
<footer>
  音频由 Azure 语音合成实时生成，首次播放约需 1–2 秒。选好后我再把音色接进 Vmi 的回复播报。
</footer>

<script>
(function(){
  var TEXT = '欢迎回家，Vikyi';
  var PWD_KEY = 'v_ing_ws_pwd';
  var VOICES = [
    { key:'zh-CN-XiaoxiaoNeural',   name:'晓晓', desc:'温暖女声 · 清晰亲和，最接近小爱' },
    { key:'zh-CN-XiaoyiNeural',     name:'晓伊', desc:'活泼女声 · 轻快，语气年轻' },
    { key:'zh-CN-XiaochenNeural',   name:'晓辰', desc:'随性女声 · 像日常聊天' },
    { key:'zh-CN-XiaohanNeural',    name:'晓涵', desc:'温柔女声 · 语速平稳，偏柔和' },
    { key:'zh-CN-XiaomengNeural',   name:'晓梦', desc:'甜美女声 · 音调偏高' },
    { key:'zh-CN-XiaoqiuNeural',    name:'晓秋', desc:'知性女声 · 成熟、播报感' },
    { key:'zh-CN-XiaoyanNeural',    name:'晓颜', desc:'亲和女声 · 口语自然' },
    { key:'zh-CN-XiaoshuangNeural', name:'晓双', desc:'童声 · 小女孩音色' },
    { key:'zh-CN-YunxiNeural',      name:'云希', desc:'阳光男声 · 少年感' },
    { key:'zh-CN-YunyangNeural',    name:'云扬', desc:'播音男声 · 专业沉稳' }
  ];

  var grid = document.getElementById('grid');
  var pwdInput = document.getElementById('pwd');
  var pwdSave = document.getElementById('pwdSave');
  var gateNote = document.getElementById('gateNote');
  var audio = new Audio();
  var current = null;
  var pwd = '';

  try { pwd = sessionStorage.getItem(PWD_KEY) || ''; } catch (e) {}
  if (pwd) pwdInput.value = pwd;

  audio.addEventListener('ended', setIdle);
  audio.addEventListener('error', function(){
    if (current) fail(current, '播放失败，请再点一次');
    setIdle();
  });

  function note(text, bad){
    gateNote.textContent = text;
    gateNote.style.color = bad ? '#ff7b7b' : '';
  }

  function setIdle(){
    grid.querySelectorAll('.card.playing').forEach(function(c){ c.classList.remove('playing'); });
    grid.querySelectorAll('button.play').forEach(function(b){ b.disabled = false; b.textContent = '试听'; });
    current = null;
  }

  function fail(card, msg){
    var old = card.querySelector('.err');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'err';
    el.textContent = msg;
    card.querySelector('.info').appendChild(el);
  }

  function play(card, btn, voice){
    var old = card.querySelector('.err');
    if (old) old.remove();
    if (current === card && !audio.paused){
      audio.pause();
      setIdle();
      return;
    }
    var p = (pwdInput.value || '').trim();
    if (!p){
      note('先输入工作台密码，再点试听。', true);
      pwdInput.focus();
      return;
    }
    pwd = p;
    try { sessionStorage.setItem(PWD_KEY, p); } catch (e) {}

    setIdle();
    current = card;
    card.classList.add('playing');
    btn.disabled = true;
    btn.textContent = '生成中';

    fetch('/api/v-ing-tts?voice=' + encodeURIComponent(voice.key) +
          '&text=' + encodeURIComponent(TEXT), { headers: { 'X-Password': p } })
      .then(function(res){
        if (res.ok) return res.blob();
        return res.json().catch(function(){ return {}; }).then(function(d){
          if (res.status === 403) throw new Error('密码不对，请重新输入。');
          if (res.status === 503) {
            if (d.error === 'Voice not configured') throw new Error('还没配置语音 Key，先去「工作台 → 设置 → 语音」保存。');
            if (d.error === 'Invalid voice key') throw new Error('Azure Key 无效或区域不匹配，请回设置里检查。');
            if (d.error === 'Voice quota exceeded') throw new Error('Azure 免费额度用完了，稍后再试。');
          }
          throw new Error('生成失败（' + res.status + '），稍后再试。');
        });
      })
      .then(function(blob){
        if (!blob.size) throw new Error('生成失败，请再点一次。');
        var url = URL.createObjectURL(blob);
        audio.src = url;
        audio.play().then(function(){
          if (btn.textContent === '生成中') btn.textContent = '播放中';
          note('已解锁，可以直接点试听。');
        }).catch(function(){
          throw new Error('浏览器拦截了播放，请再点一次。');
        });
      })
      .catch(function(err){
        note(err.message, true);
        fail(card, err.message);
        setIdle();
      });
  }

  VOICES.forEach(function(v, i){
    var card = document.createElement('div');
    card.className = 'card';

    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = String(i + 1);

    var info = document.createElement('div');
    info.className = 'info';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = v.name;
    var desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = v.desc;
    info.appendChild(name);
    info.appendChild(desc);

    var btn = document.createElement('button');
    btn.className = 'play';
    btn.type = 'button';
    btn.textContent = '试听';
    btn.addEventListener('click', function(){ play(card, btn, v); });

    card.appendChild(num);
    card.appendChild(info);
    card.appendChild(btn);
    grid.appendChild(card);
  });

  pwdSave.addEventListener('click', function(){
    var p = (pwdInput.value || '').trim();
    if (!p){
      note('先输入工作台密码。', true);
      pwdInput.focus();
      return;
    }
    pwd = p;
    try { sessionStorage.setItem(PWD_KEY, p); } catch (e) {}
    note('已解锁，点任意一条试听。');
  });

  pwdInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); pwdSave.click(); }
  });
})();
</script>
</body>
</html>
