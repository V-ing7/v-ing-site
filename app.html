<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>微影 V-ing</title>
  <meta name="description" content="微影 V-ing 影视创作工作室 App — 实时同步版">
  <meta name="theme-color" content="#e6be8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="微影">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/pwa-icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/pwa-icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/pwa-icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/assets/pwa-icon-512.png">
  <link rel="apple-touch-icon" sizes="1024x1024" href="/assets/pwa-icon-512.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #webview {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
    }
    /* 实时同步状态徽章 */
    #sync-badge {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      right: 12px;
      z-index: 9999;
      padding: 6px 14px;
      border-radius: 18px;
      background: rgba(20, 20, 20, .85);
      color: #e6be8a;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 190, 138, .35);
      display: none;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
      transition: opacity .3s, transform .3s;
    }
    #sync-badge.show { display: flex; }
    #sync-badge.live { border-color: rgba(76, 175, 80, .6); color: #4caf50; }
    #sync-badge.warn { border-color: rgba(255, 152, 0, .6); color: #ff9800; }
    #sync-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
    #sync-badge.live .dot {
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.3); }
    }
    /* 离线提示 */
    #offline-banner {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      padding: 6px 16px;
      border-radius: 16px;
      background: rgba(255, 152, 0, .15);
      color: #ff9800;
      font-size: 11px;
      border: 1px solid rgba(255, 152, 0, .4);
      backdrop-filter: blur(8px);
      display: none;
      pointer-events: none;
    }
    #offline-banner.show { display: block; }
  </style>
</head>
<body>
  <div id="sync-badge"><span class="dot"></span><span id="sync-text">实时同步</span></div>
  <div id="offline-banner">网络离线，仅显示缓存数据</div>
  <iframe id="webview" src="/"></iframe>
  <script src="/js/app-pwa.js"></script>
</body>
</html>
