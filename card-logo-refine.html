<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo 微调提案 · 3 款对比</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --label:#1d1d1f;
    --label-2:#6e6e73;
    --label-3:#a1a1a6;
    --hairline:rgba(0,0,0,.08);
    --surface:#fff;
    --surface-2:#f5f5f7;
  }
  body{
    font-family:'Inter','Noto Sans SC',sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1c1c1e 0%,#000 60%);
    color:#e0e0e0;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:50px 20px 80px;gap:36px;
    -webkit-font-smoothing:antialiased;
  }
  .page-title{
    font-size:12px;letter-spacing:5px;color:#86868b;
    text-transform:uppercase;font-weight:500;
    display:flex;align-items:center;gap:12px;
  }
  .page-title::before,.page-title::after{
    content:'';width:30px;height:1px;background:#444;
  }

  .prop{
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .prop-label{
    font-size:10px;letter-spacing:3px;color:#a1a1a6;
    text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .prop-label .tag{
    padding:2px 10px;background:#2a2a2e;border-radius:10px;
    color:#fff;font-size:9px;letter-spacing:2px;
  }
  .prop-desc{
    font-size:11px;color:#86868b;letter-spacing:0.5px;
    max-width:240px;text-align:center;line-height:1.5;
  }

  /* 预览框：模拟名片头部 */
  .preview{
    width:70mm;height:14mm;
    background:var(--surface);
    border-radius:3mm;
    padding:4mm 5.5mm;
    display:flex;align-items:center;justify-content:space-between;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));
    position:relative;overflow:hidden;
  }
  .brand{display:flex;align-items:center;gap:1.8mm}
  .wordmark{
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Noto Sans SC',sans-serif;
    font-size:12px;font-weight:700;color:var(--label);
    letter-spacing:-0.02em;line-height:1;
  }
  .wordmark .dot{color:var(--label-3)}
  .no{
    font-size:7px;font-weight:600;color:var(--label-2);
    letter-spacing:1.2px;font-variant-numeric:tabular-nums;
    padding:1.1mm 2.2mm;background:var(--surface-2);
    border-radius:2.2mm;
  }

  /* logo 容器通用 */
  .logo{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--label);
  }
  .logo svg{display:block}

  /* ============ 提案 1: 标准等比 1:1 ============ */
  /* 原 viewBox 354.9×295.83 ≈ 1.2:1，强制 1:1 容器，内部居中 */
  .prop-1 .logo{width:6mm;height:6mm}
  .prop-1 .logo svg{
    width:6mm;height:6mm;
    /* 描边加粗：用 filter 模拟 */
    filter:drop-shadow(0.3mm 0 0 var(--label)) drop-shadow(-0.3mm 0 0 var(--label)) drop-shadow(0 0.3mm 0 var(--label)) drop-shadow(0 -0.3mm 0 var(--label));
  }

  /* ============ 提案 2: 1:1 + 线条加粗 ============ */
  .prop-2 .logo{width:6.5mm;height:6.5mm}
  .prop-2 .logo svg{
    width:6.5mm;height:6.5mm;
    /* 更强的描边 */
    filter:
      drop-shadow(0.4mm 0 0 var(--label))
      drop-shadow(-0.4mm 0 0 var(--label))
      drop-shadow(0 0.4mm 0 var(--label))
      drop-shadow(0 -0.4mm 0 var(--label))
      drop-shadow(0.3mm 0.3mm 0 var(--label))
      drop-shadow(-0.3mm -0.3mm 0 var(--label))
      drop-shadow(0.3mm -0.3mm 0 var(--label))
      drop-shadow(-0.3mm 0.3mm 0 var(--label));
  }

  /* ============ 提案 3: 1:1 + 线条变细 ============ */
  .prop-3 .logo{width:5.5mm;height:5.5mm}
  .prop-3 .logo svg{
    width:5.5mm;height:5.5mm;
    /* 线条变细：用 transform scale 拉伸 + opacity 调整 */
    opacity:.85;
    transform:scale(.95);
  }

  /* 放大对比区 */
  .zoom-row{
    display:flex;gap:20px;align-items:flex-end;
    margin-top:8px;
  }
  .zoom-box{
    width:60px;height:60px;
    background:var(--surface);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:var(--label);
    border:1px solid #333;
  }
  .zoom-box svg{display:block}
</style>
</head>
<body>

<div class="page-title">LOGO REFINE · 3 PROPOSALS</div>

    <div class="zoom-box">
      <svg width="40" height="40" viewBox="0 0 354.9 295.83" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(2px 0 0 #1d1d1f) drop-shadow(-2px 0 0 #1d1d1f) drop-shadow(0 2px 0 #1d1d1f) drop-shadow(0 -2px 0 #1d1d1f)">

      </svg>
    </div>
  </div>
  <div class="prop-desc">6mm × 6mm 容器，4 向 0.3mm 描边加粗</div>
</div>
