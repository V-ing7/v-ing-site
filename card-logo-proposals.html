<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo 排版提案 · 3 款对比</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --surface:#ffffff;
    --surface-2:#f5f5f7;
    --label:#1d1d1f;
    --label-2:#6e6e73;
    --label-3:#a1a1a6;
    --hairline:rgba(0,0,0,.08);
  }
  body{
    font-family:'Inter','Noto Sans SC',sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1c1c1e 0%,#000 60%);
    color:#e0e0e0;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:50px 20px 80px;gap:40px;
    -webkit-font-smoothing:antialiased;
  }
  .page-title{
    font-size:12px;letter-spacing:5px;color:#86868b;
    text-transform:uppercase;font-weight:500;
    display:flex;align-items:center;gap:12px;
  }
  .page-title::before,.page-title::after{
    content:'';width:30px;height:1px;background:#444;
  }

  .proposal{
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .prop-label{
    font-size:10px;letter-spacing:3px;color:#a1a1a6;
    text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .prop-label .tag{
    padding:2px 10px;background:#2a2a2e;border-radius:10px;
    color:#fff;font-size:9px;letter-spacing:2px;
  }
  .prop-desc{
    font-size:11px;color:#86868b;letter-spacing:0.5px;
    max-width:200px;text-align:center;line-height:1.5;
  }

  /* === 通用名片头部预览框（只显示头部区域） === */
  .preview-box{
    width:70mm;height:18mm;
    background:var(--surface);
    border-radius:3mm;
    padding:4mm 5.5mm 3.5mm;
    display:flex;flex-direction:column;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));
    position:relative;overflow:hidden;
  }
  .preview-box .head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:3.5mm;
    border-bottom:0.2mm solid var(--hairline);
    flex:1;
  }
  .no{
    font-size:7px;font-weight:600;color:var(--label-2);
    letter-spacing:1.2px;font-variant-numeric:tabular-nums;
    padding:1.1mm 2.2mm;background:var(--surface-2);
    border-radius:2.2mm;align-self:flex-start;
  }

  /* ============ 提案 A: 横向极简 ============ */
  .prop-a .brand{display:flex;align-items:center;gap:2mm}
  .prop-a .logo{
    width:5mm;height:5mm;flex-shrink:0;color:var(--label);
    display:flex;align-items:center;justify-content:center;
  }
  .prop-a .logo svg{width:5mm;height:5mm;display:block}
  .prop-a .name{
    font-size:11px;font-weight:700;color:var(--label);
    letter-spacing:1px;line-height:1;
  }
  .prop-a .name .en{
    display:block;font-size:6px;font-weight:500;
    color:var(--label-3);letter-spacing:2.5px;margin-top:1mm;
    text-transform:uppercase;
  }

  /* ============ 提案 B: 上下堆叠（logo 居中放大） ============ */
  .prop-b .brand{
    display:flex;flex-direction:column;align-items:center;gap:0.8mm;
  }
  .prop-b .logo{
    width:7mm;height:7mm;color:var(--label);
    display:flex;align-items:center;justify-content:center;
  }
  .prop-b .logo svg{width:7mm;height:7mm;display:block}
  .prop-b .name{
    font-size:9px;font-weight:700;color:var(--label);
    letter-spacing:2px;line-height:1;text-align:center;
  }
  .prop-b .name .en{
    display:block;font-size:5px;font-weight:500;
    color:var(--label-3);letter-spacing:3px;margin-top:0.8mm;
    text-transform:uppercase;
  }

  /* ============ 提案 C: logo 作背景 + 文字独立 ============ */
  .prop-c .brand{
    display:flex;align-items:center;gap:2mm;
    position:relative;width:100%;
  }
  .prop-c .logo-bg{
    position:absolute;right:18mm;top:50%;
    transform:translateY(-50%);
    width:14mm;height:14mm;color:var(--label);
    opacity:.06;pointer-events:none;
  }
  .prop-c .logo-bg svg{width:14mm;height:14mm;display:block}
  .prop-c .name{
    font-size:11px;font-weight:700;color:var(--label);
    letter-spacing:1px;line-height:1;
    position:relative;z-index:1;
  }
  .prop-c .name .en{
    display:block;font-size:6px;font-weight:500;
    color:var(--label-3);letter-spacing:2.5px;margin-top:1mm;
    text-transform:uppercase;
  }
  .prop-c .name .accent{
    display:inline-block;width:3mm;height:0.4mm;
    background:var(--label);vertical-align:middle;
    margin-right:1.5mm;
  }
</style>
</head>
<body>

<div class="page-title">LOGO LAYOUT · 3 PROPOSALS</div>

<!-- ============ 提案 A ============ -->
<div class="proposal prop-a">
  <div class="prop-label"><span class="tag">A</span> 横向极简</div>
  <div class="preview-box">
    <div class="head">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 354.9 295.83" xmlns="http://www.w3.org/2000/svg">
            <path d="M321.7,4.36c1.21-1.89-.15-4.36-2.39-4.36h-97.07c-5.69,0-11,2.84-14.15,7.57l-31.45,47.17c-1.12,1.68-3.59,1.68-4.72,0l-31.45-47.17c-3.15-4.73-8.46-7.57-14.15-7.57H56.17C27.33,0,5.97,14.04.12,34.05c-.53,1.83.82,3.66,2.72,3.66h109.67c.95,0,1.85.48,2.37,1.28l59.45,90.51c1.12,1.7,3.62,1.7,4.74,0l59.45-90.51c.52-.8,1.41-1.28,2.37-1.28h12.24c2.25,0,3.6,2.49,2.38,4.38l-64.95,100.02h0l-11.49,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.49-17.24h0l-56.23-86.59c-.52-.81-1.42-1.29-2.38-1.29H4.56c-2.23,0-3.59,2.46-2.4,4.34l136.23,216.39c17.91,27.87,58.51,27.79,76.54,0l130.39-201.26c15.19-23.42,11.28-45.45-4.39-59.22-1.28-1.13-3.28-.82-4.22.61l-146.15,224.9h0l-11.5,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.5-17.24L69.31,96.17c-1.23-1.89.13-4.38,2.38-4.38h11.93c.95,0,1.84.48,2.37,1.28l88.31,134.28c1.13,1.72,3.65,1.7,4.76-.03L321.71,4.36h0Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="name">微影工作室<span class="en">V-ING STUDIO</span></div>
      </div>
      <div class="no">No.001</div>
    </div>
  </div>
  <div class="prop-desc">logo 左 + 文字右横排，简洁专业，Apple/Google 风格</div>
</div>

<!-- ============ 提案 B ============ -->
<div class="proposal prop-b">
  <div class="prop-label"><span class="tag">B</span> 上下堆叠</div>
  <div class="preview-box">
    <div class="head" style="justify-content:center">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 354.9 295.83" xmlns="http://www.w3.org/2000/svg">
            <path d="M321.7,4.36c1.21-1.89-.15-4.36-2.39-4.36h-97.07c-5.69,0-11,2.84-14.15,7.57l-31.45,47.17c-1.12,1.68-3.59,1.68-4.72,0l-31.45-47.17c-3.15-4.73-8.46-7.57-14.15-7.57H56.17C27.33,0,5.97,14.04.12,34.05c-.53,1.83.82,3.66,2.72,3.66h109.67c.95,0,1.85.48,2.37,1.28l59.45,90.51c1.12,1.7,3.62,1.7,4.74,0l59.45-90.51c.52-.8,1.41-1.28,2.37-1.28h12.24c2.25,0,3.6,2.49,2.38,4.38l-64.95,100.02h0l-11.49,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.49-17.24h0l-56.23-86.59c-.52-.81-1.42-1.29-2.38-1.29H4.56c-2.23,0-3.59,2.46-2.4,4.34l136.23,216.39c17.91,27.87,58.51,27.79,76.54,0l130.39-201.26c15.19-23.42,11.28-45.45-4.39-59.22-1.28-1.13-3.28-.82-4.22.61l-146.15,224.9h0l-11.5,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.5-17.24L69.31,96.17c-1.23-1.89.13-4.38,2.38-4.38h11.93c.95,0,1.84.48,2.37,1.28l88.31,134.28c1.13,1.72,3.65,1.7,4.76-.03L321.71,4.36h0Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="name">微影工作室<span class="en">V-ING STUDIO</span></div>
      </div>
    </div>
  </div>
  <div class="prop-desc">logo 居中放大置上，文字下方居中堆叠，金字塔层次</div>
</div>

<!-- ============ 提案 C ============ -->
<div class="proposal prop-c">
  <div class="prop-label"><span class="tag">C</span> logo 作背景</div>
  <div class="preview-box">
    <div class="head">
      <div class="brand">
        <div class="logo-bg">
          <svg viewBox="0 0 354.9 295.83" xmlns="http://www.w3.org/2000/svg">
            <path d="M321.7,4.36c1.21-1.89-.15-4.36-2.39-4.36h-97.07c-5.69,0-11,2.84-14.15,7.57l-31.45,47.17c-1.12,1.68-3.59,1.68-4.72,0l-31.45-47.17c-3.15-4.73-8.46-7.57-14.15-7.57H56.17C27.33,0,5.97,14.04.12,34.05c-.53,1.83.82,3.66,2.72,3.66h109.67c.95,0,1.85.48,2.37,1.28l59.45,90.51c1.12,1.7,3.62,1.7,4.74,0l59.45-90.51c.52-.8,1.41-1.28,2.37-1.28h12.24c2.25,0,3.6,2.49,2.38,4.38l-64.95,100.02h0l-11.49,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.49-17.24h0l-56.23-86.59c-.52-.81-1.42-1.29-2.38-1.29H4.56c-2.23,0-3.59,2.46-2.4,4.34l136.23,216.39c17.91,27.87,58.51,27.79,76.54,0l130.39-201.26c15.19-23.42,11.28-45.45-4.39-59.22-1.28-1.13-3.28-.82-4.22.61l-146.15,224.9h0l-11.5,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.5-17.24L69.31,96.17c-1.23-1.89.13-4.38,2.38-4.38h11.93c.95,0,1.84.48,2.37,1.28l88.31,134.28c1.13,1.72,3.65,1.7,4.76-.03L321.71,4.36h0Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="name"><span class="accent"></span>微影工作室<span class="en">V-ING STUDIO</span></div>
      </div>
      <div class="no">No.001</div>
    </div>
  </div>
  <div class="prop-desc">logo 6% 透明度作背景装饰，文字独立排版 + 装饰横线</div>
</div>

</body>
</html>
