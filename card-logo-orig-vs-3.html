<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原版 vs 提案3 · Logo 对比</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --label:#1d1d1f;
    --label-2:#6e6e73;
    --label-3:#a1a1a6;
    --surface:#fff;
    --surface-2:#f5f5f7;
  }
  body{
    font-family:'Inter','Noto Sans SC',sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1c1c1e 0%,#000 60%);
    color:#e0e0e0;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:50px 20px 80px;gap:40px;
    -webkit-font-smoothing:antialiased;
  }
  .page-title{
    font-size:12px;letter-spacing:5px;color:#86868b;
    text-transform:uppercase;font-weight:500;
    display:flex;align-items:center;gap:12px;
  }
  .page-title::before,.page-title::after{
    content:'';width:30px;height:1px;background:#444;
  }

  .compare-row{
    display:flex;gap:30px;align-items:flex-start;
  }
  .col{
    display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .col-label{
    font-size:10px;letter-spacing:3px;color:#a1a1a6;
    text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .col-label .tag{
    padding:2px 10px;border-radius:10px;
    color:#fff;font-size:9px;letter-spacing:2px;
  }
  .tag-orig{background:#6e6e73}
  .tag-3{background:#0a84ff}

  /* 名片头部预览 */
  .preview{
    width:70mm;height:14mm;
    background:var(--surface);
    border-radius:3mm;
    padding:4mm 5.5mm;
    display:flex;align-items:center;justify-content:space-between;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));
  }
  .brand{display:flex;align-items:center;gap:1.8mm}
  .wordmark{
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Noto Sans SC',sans-serif;
    font-size:12px;font-weight:700;color:var(--label);
    letter-spacing:-0.02em;line-height:1;
  }
  .wordmark .dot{color:var(--label-3)}
  .no{
    font-size:7px;font-weight:600;color:var(--label-2);
    letter-spacing:1.2px;font-variant-numeric:tabular-nums;
    padding:1.1mm 2.2mm;background:var(--surface-2);
    border-radius:2.2mm;
  }
  .logo{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--label);
  }
  .logo svg{display:block}

  /* 原版 */
  .orig .logo{width:6mm;height:6mm}
  .orig .logo svg{width:6mm;height:6mm}

  /* 提案3 */
  .prop3 .logo{width:5.5mm;height:5.5mm}
  .prop3 .logo svg{
    width:5.5mm;height:5.5mm;
    opacity:.85;transform:scale(.95);
  }

  /* 放大对比 */
  .zoom-block{
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .zoom-box{
    width:80px;height:80px;
    background:var(--surface);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid #333;
  }
  .zoom-box svg{display:block}
  .zoom-spec{
    font-family:'JetBrains Mono','Courier New',monospace;
    font-size:9px;color:#86868b;letter-spacing:0.5px;
    text-align:center;line-height:1.6;
  }
  .zoom-spec b{color:#e0e0e0;font-weight:600}

  .vs{
    font-family:'Bebas Neue',sans-serif;
    font-size:24px;color:#6e6e73;
    align-self:center;margin-top:120px;
    letter-spacing:2px;
  }

  .diff-table{
    width:560px;
    background:#1c1c1e;
    border-radius:10px;
    padding:18px 24px;
    border:1px solid #2a2a2e;
  }
  .diff-table h3{
    font-size:10px;letter-spacing:3px;color:#86868b;
    text-transform:uppercase;font-weight:600;
    margin-bottom:14px;
  }
  .diff-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;
    border-bottom:1px solid #2a2a2e;
    font-size:11px;
  }
  .diff-row:last-child{border-bottom:none}
  .diff-row .key{color:#a1a1a6;font-family:'JetBrains Mono',monospace}
  .diff-row .val-orig{color:#6e6e73;font-family:'JetBrains Mono',monospace}
  .diff-row .val-3{color:#0a84ff;font-family:'JetBrains Mono',monospace}
  .diff-row .arrow{color:#444}
</style>
</head>
<body>

<div class="page-title">ORIGINAL vs PROPOSAL 3</div>

  <!-- 原版 -->

      </div>
      <div class="no">No.001</div>
    </div>
    <div class="zoom-block">
      <div class="zoom-box">
        <svg width="60" height="60" viewBox="0 0 354.9 295.83" xmlns="http://www.w3.org/2000/svg">
          <path d="M321.7,4.36c1.21-1.89-.15-4.36-2.39-4.36h-97.07c-5.69,0-11,2.84-14.15,7.57l-31.45,47.17c-1.12,1.68-3.59,1.68-4.72,0l-31.45-47.17c-3.15-4.73-8.46-7.57-14.15-7.57H56.17C27.33,0,5.97,14.04.12,34.05c-.53,1.83.82,3.66,2.72,3.66h109.67c.95,0,1.85.48,2.37,1.28l59.45,90.51c1.12,1.7,3.62,1.7,4.74,0l59.45-90.51c.52-.8,1.41-1.28,2.37-1.28h12.24c2.25,0,3.6,2.49,2.38,4.38l-64.95,100.02h0l-11.49,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.49-17.24h0l-56.23-86.59c-.52-.81-1.42-1.29-2.38-1.29H4.56c-2.23,0-3.59,2.46-2.4,4.34l136.23,216.39c17.91,27.87,58.51,27.79,76.54,0l130.39-201.26c15.19-23.42,11.28-45.45-4.39-59.22-1.28-1.13-3.28-.82-4.22.61l-146.15,224.9h0l-11.5,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.5-17.24L69.31,96.17c-1.23-1.89.13-4.38,2.38-4.38h11.93c.95,0,1.84.48,2.37,1.28l88.31,134.28c1.13,1.72,3.65,1.7,4.76-.03L321.71,4.36h0Z" fill="#1d1d1f"/>
        </svg>
      </div>
      <div class="zoom-spec"><b>6.0mm × 6.0mm</b><br>opacity 1.0 · scale 1.0</div>
    </div>
  </div>

  <div class="vs">VS</div>

  <!-- 提案3 -->
  <div class="col">
    <div class="col-label"><span class="tag tag-3">P3</span> 提案3</div>
    <div class="preview prop3">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 354.9 295.83" xmlns="http://www.w3.org/2000/svg">
            <path d="M321.7,4.36c1.21-1.89-.15-4.36-2.39-4.36h-97.07c-5.69,0-11,2.84-14.15,7.57l-31.45,47.17c-1.12,1.68-3.59,1.68-4.72,0l-31.45-47.17c-3.15-4.73-8.46-7.57-14.15-7.57H56.17C27.33,0,5.97,14.04.12,34.05c-.53,1.83.82,3.66,2.72,3.66h109.67c.95,0,1.85.48,2.37,1.28l59.45,90.51c1.12,1.7,3.62,1.7,4.74,0l59.45-90.51c.52-.8,1.41-1.28,2.37-1.28h12.24c2.25,0,3.6,2.49,2.38,4.38l-64.95,100.02h0l-11.49,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.49-17.24h0l-56.23-86.59c-.52-.81-1.42-1.29-2.38-1.29H4.56c-2.23,0-3.59,2.46-2.4,4.34l136.23,216.39c17.91,27.87,58.51,27.79,76.54,0l130.39-201.26c15.19-23.42,11.28-45.45-4.39-59.22-1.28-1.13-3.28-.82-4.22.61l-146.15,224.9h0l-11.5,17.24c-1.12,1.68-3.59,1.68-4.72,0l-11.5-17.24L69.31,96.17c-1.23-1.89.13-4.38,2.38-4.38h11.93c.95,0,1.84.48,2.37,1.28l88.31,134.28c1.13,1.72,3.65,1.7,4.76-.03L321.71,4.36h0Z" fill="currentColor"/>

<!-- 参数对比表 -->
<div class="diff-table">
  <h3>参数差异</h3>
  <div class="diff-row">
    <span class="key">尺寸</span>
    <span class="val-orig">6.0mm × 6.0mm</span>
    <span class="arrow">→</span>
    <span class="val-3">5.5mm × 5.5mm</span>
  </div>
  <div class="diff-row">
    <span class="key">opacity</span>
    <span class="val-orig">1.0 (100%)</span>
    <span class="arrow">→</span>
    <span class="val-3">0.85 (85%)</span>
  </div>
  <div class="diff-row">
    <span class="key">scale</span>
    <span class="val-orig">1.0</span>
    <span class="arrow">→</span>
    <span class="val-3">0.95</span>
  </div>
  <div class="diff-row">
    <span class="key">path 数据</span>
    <span class="val-orig">完全一致</span>
    <span class="arrow">→</span>
    <span class="val-3">完全一致</span>
  </div>
  <div class="diff-row">
    <span class="key">实际变化</span>
    <span class="val-orig">—</span>
    <span class="arrow">→</span>
    <span class="val-3">仅尺寸 -8% / 颜色淡 15%</span>
  </div>
</div>

</body>
</html>
